[package]
name = "caixonho-gui"
description = "caixonho desktop app (GPUI). Currently the M0 spike."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
caixonho-core.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow.workspace = true
tokio.workspace = true
flume.workspace = true

# GPUI's own test support — what turns on `#[gpui::test]`, `TestAppContext`,
# `debug_selector`/`debug_bounds` and `capture_screenshot`, none of which exist
# without it. The spec is the workspace one, so ADR-0001's byte-identical rule
# is untouched: a feature is not a different source. It adds proptest and seven
# of its dependencies to the lockfile, and builds gpui a second time under the
# test profile — measured at 31 seconds, against tests that run in 0.01.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# `gpui_platform`'s own `test-support`, which is the only thing that defines
# `current_headless_renderer` — without it there is no renderer to capture a
# screenshot with (`gpui_platform.rs:84`). Same reasoning as the line above:
# the spec is the workspace one, so ADR-0001's byte-identical rule is
# untouched, because a feature is not a different source.
gpui_platform = { workspace = true, features = ["test-support"] }
# The core crate's own doubles — the keychain, the connections file and the
# object store — so a window test builds over them instead of over the
# machine's `~/.aws` (`XONHO-0015`). Dev-only, so the shipped binary is the
# same binary; resolver 2 keeps a dev feature out of a build without dev
# targets, and that was measured rather than assumed.
caixonho-core = { workspace = true, features = ["test-support"] }
