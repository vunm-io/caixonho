[package]
name = "caixonho-core"
description = "Core engine of caixonho: auth, listing, capability model, transfers. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-ssooidc.workspace = true
aws-runtime.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-json.workspace = true
aws-smithy-types.workspace = true
sha1.workspace = true
hex.workspace = true
keyring.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `test-service` only — see that feature for why these are here and not under
# `[dev-dependencies]`.
s3s = { workspace = true, optional = true }
s3s-fs = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
# Off by default. Exposes `store::double::StoreDouble` and
# `Session::install_object_store`, so `caixonho-gui` can build a window over a
# session that reads from a script rather than from the machine's `~/.aws`
# (`XONHO-0015`). Only those two: a frontend is handed its connections rather
# than reading them, so the keychain and connections-file injectors stay
# `pub(crate)`.
#
# A feature rather than plain `pub`: a test-only API on the shipped surface is
# one nobody dares remove later, which is the rubbish the close-out review in
# AGENTS.md exists to catch. Same arrangement as `gpui`'s `test-support`, which
# this workspace already consumes.
test-support = []
# Off by default, and dev-only wherever it is on. Exposes [`test_service`]: a
# real S3 service (`s3s-fs`) a test starts in-process on a port the OS chooses,
# and the `Session`-shaped wiring to reach it the way the application does
# (`XONHO-0031`). It lived in `tests/service.rs` until the window's own tests
# needed it too — an integration-test module cannot be reached from another
# crate, and a second copy of a harness is two harnesses to keep working.
#
# The four crates behind it are `optional` normal dependencies rather than
# dev-dependencies for that reason alone: a feature can only turn on what the
# manifest can see. They enter no build that does not ask for the feature —
# resolver 2, measured with `cargo tree --edges normal,no-dev` over
# `caixonho-gui` before and after, not assumed. This crate's own integration
# tests get the feature through the self-dependency under `[dev-dependencies]`.
test-service = ["dep:s3s", "dep:s3s-fs", "dep:hyper-util", "dep:tempfile"]

[dev-dependencies]
# `StaticReplayClient`, for the canned HTTP exchanges `xonho-0018` needs to
# prove a region redirect is followed. The crate is already a normal
# dependency above; only the extra feature is dev-only.
#
# Dev-only is safe rather than merely tidy: resolver 2 does not unify
# dev-dependency features into a build that excludes dev targets, so the
# release binary keeps the feature set it had — measured, not assumed, by
# comparing `cargo tree --edges features,no-dev` before and after. And this
# crate is not part of the UI stack `ADR-0001` freezes, so nothing pinned by
# `rev` or by `Cargo.lock` is disturbed by touching its features.
aws-smithy-http-client = { workspace = true, features = ["test-util"] }

# XONHO-0031. This crate's own integration tests reach the real-service
# harness through the `test-service` feature like any other consumer would,
# and a crate cannot turn on its own feature for its tests any other way than
# by depending on itself here. Cargo permits exactly this.
caixonho-core = { path = ".", features = ["test-service"] }
