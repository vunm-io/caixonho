[package]
name = "caixonho-core"
description = "Core engine of caixonho: auth, listing, capability model, transfers. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-ssooidc.workspace = true
aws-runtime.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-json.workspace = true
aws-smithy-types.workspace = true
sha1.workspace = true
hex.workspace = true
keyring.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Off by default. Exposes `store::double::StoreDouble` and
# `Session::install_object_store`, so `caixonho-gui` can build a window over a
# session that reads from a script rather than from the machine's `~/.aws`
# (`XONHO-0015`). Only those two: a frontend is handed its connections rather
# than reading them, so the keychain and connections-file injectors stay
# `pub(crate)`.
#
# A feature rather than plain `pub`: a test-only API on the shipped surface is
# one nobody dares remove later, which is the rubbish the close-out review in
# AGENTS.md exists to catch. Same arrangement as `gpui`'s `test-support`, which
# this workspace already consumes.
test-support = []

[dev-dependencies]
# `StaticReplayClient`, for the canned HTTP exchanges `xonho-0018` needs to
# prove a region redirect is followed. The crate is already a normal
# dependency above; only the extra feature is dev-only.
#
# Dev-only is safe rather than merely tidy: resolver 2 does not unify
# dev-dependency features into a build that excludes dev targets, so the
# release binary keeps the feature set it had — measured, not assumed, by
# comparing `cargo tree --edges features,no-dev` before and after. And this
# crate is not part of the UI stack `ADR-0001` freezes, so nothing pinned by
# `rev` or by `Cargo.lock` is disturbed by touching its features.
aws-smithy-http-client = { workspace = true, features = ["test-util"] }

# XONHO-0031. A real S3 service, started by the test that needs it, so the
# adapter is exercised over HTTP rather than only above and below itself.
s3s.workspace = true
s3s-fs.workspace = true
hyper-util.workspace = true
tempfile.workspace = true
