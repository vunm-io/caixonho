[workspace]
resolver = "2"
members = ["crates/caixonho-core", "crates/caixonho-gui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vunm-io/caixonho"
authors = ["Vu Nguyen <vunm.dev@gmail.com>"]

[workspace.dependencies]
caixonho-core = { path = "crates/caixonho-core" }

# UI stack — ADR-0001 (Stack B: git-pinned, tracking upstream development).
#
# `gpui` and `gpui_platform` deliberately carry NO `rev`: their specs must be
# byte-identical to gpui-component's own declarations so Cargo unifies them
# into a single source. The actual zed commit is frozen by Cargo.lock.
# Bumping any of these is a deliberate, standalone PR — see ADR-0001.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "7a9ac172e804ce89aebac644a02f09813dc9e793" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "7a9ac172e804ce89aebac644a02f09813dc9e793" }

# XONHO-0031. An S3 service the tests start themselves, so a generic-S3 flow
# stops needing the owner to accept it by hand. Dev-only, and that matters
# here more than usual: XONHO-0017 spent real effort getting this workspace's
# `cargo deny check advisories` to clean, and a test dependency must not undo
# it. Measured over its own graph before adding — 148 crates, zero
# vulnerabilities, `advisories ok` — and re-measured over the merged one.
#
# `s3s-fs` rather than a container: Docker is installed on the owner's machine
# and its daemon is normally not running, and a tier whose first act is "start
# Docker Desktop" is a tier that gets skipped. This one binds a port from
# inside the test and needs nothing on either CI runner.
s3s = "0.15.0"
s3s-fs = "0.15.0"
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
tempfile = "3"

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
flume = "0.11"

# AWS stack — XONHO-0003. Versions verified against crates.io on 2026-08-19;
# Cargo.lock freezes the exact graph, bumps are deliberate.
aws-config = { version = "1.10.1", features = ["sso"] }
# `default-features = false` on purpose (XONHO-0017). The default set includes
# `rustls` and `default-https-client`, which supply an HTTP client this
# application never uses — every AWS client here is handed the one stack from
# `tls.rs` explicitly. What those features actually did was pull
# `aws-smithy-runtime/tls-rustls`, and with it the legacy hyper-0.14 /
# rustls-0.21 client: four RUSTSEC advisories compiled into the shipped binary
# to provide a client that was replaced at every construction site. Measured,
# not argued — dropping them takes `cargo audit` from four vulnerabilities to
# none. Anything added back here must be a feature this workspace uses.
aws-sdk-s3 = { version = "1.142.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "rt-tokio",
] }
# Direct dependency so core can build ONE HTTP client and hand it to both the
# config loader and the S3 client. aws-lc matches the crypto backend the SDK
# already selects by default, so this adds no new crypto build burden.
aws-runtime = "1.9.1"
aws-smithy-http-client = { version = "1.3.0", features = ["default-client", "rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1.14.0", features = ["client", "http-1x"] }
# XONHO-0011. Already in `Cargo.lock` — `aws-config`'s `sso` feature pulls it
# in — so naming it here adds no crate to the graph and leaves the lockfile
# untouched. Core only: the device flow lives behind a port, and the GUI never
# sees an `aws-sdk-*` type (invariant 1).
# `default-features = false` for the same reason as `aws-sdk-s3` above, and it
# is the second of the two crates that were enabling the legacy TLS stack —
# `aws-config` already declares this crate that way, so these two declarations
# were the only ones turning it on.
aws-sdk-ssooidc = { version = "1.108.0", default-features = false, features = [
    "rt-tokio",
] }
# XONHO-0011 again, and for the same reason: all four are already in
# `Cargo.lock`, pulled in by the AWS stack itself. They are named here because
# the token cache is written by hand — `aws-config`'s own writer is
# `pub(super)` — and writing it by hand means matching its JSON escaping, its
# timestamp rendering and its SHA-1 file naming exactly. Borrowing the
# libraries it uses is what makes "exactly" cheap rather than hopeful.
aws-smithy-json = "0.63.0"
aws-smithy-types = "1.6.2"
sha1 = "0.10.7"
hex = "0.4.3"
async-trait = "0.1.92"

# OS credential store — XONHO-0004. Verified on crates.io on 2026-08-19
# (MIT OR Apache-2.0). Default features are exactly what this needs: `v1`
# selects Keychain Services on macOS and the Credential Manager on Windows,
# the two v1 targets, and nothing else is enabled. The `cli` feature would
# drag in every credential store the project knows about; upstream says so
# itself.
keyring = "4.1.6"

# Diagnostics — XONHO-0012. `tracing` 0.1.44 is already in the graph because
# the AWS SDK emits through it; naming it here makes it a direct dependency so
# core can emit through the same machinery, which is what lets one subscriber
# pick up the SDK's own diagnostics without a line of glue.
#
# `tracing-subscriber` 0.3.23 (MIT) is already in `Cargo.lock` by way of the UI
# stack, with exactly the default features — so this adds no crate the lock did
# not already hold. Read out of the vendored `tracing-subscriber-0.3.23`
# manifest rather than recalled; crates.io is not reachable from this session,
# which is also why no file-appender crate is named here (see
# `diagnostics::RollingLog`).
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# The platform's own configuration location — XONHO-0004. Verified on
# crates.io on 2026-08-19 (MIT OR Apache-2.0). Used for exactly one thing: the
# directory the connections file lives in. Hand-rolling that from `HOME` and
# `APPDATA` is the alternative, and it is what this crate already does —
# tested on three platforms, which this repository is not yet in a position to
# do for itself. Windows is a first-class target here and the one least likely
# to be exercised by hand.
directories = "6.0.0"

# gpui is unusable without optimization, even in dev builds (mirrors upstream).
[profile.dev.package.gpui]
opt-level = 3
[profile.dev.package.gpui_platform]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
