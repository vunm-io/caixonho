name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  audit:
    name: dependency audit
    # Its own job, beside rustfmt rather than inside either build matrix. A
    # supply-chain failure and a compilation failure have different owners and
    # different remedies, and a red tick that could mean either tells whoever
    # reads it neither. One runner, not two: the lockfile is the same on both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Advisories
        # The policy, including which acceptances exist and why, is deny.toml.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
      - name: Acceptances are still in date
        # cargo-deny has no expiry of its own, so this is what stops the
        # ignore list becoming permanent by accident.
        run: scripts/check-advisory-expiry.sh
      - name: The expiry check can still fail
        # A gate nobody has watched fail is not known to be a gate. Both
        # fixtures run on every push, so the day this script silently stops
        # working is the day CI says so.
        run: |
          scripts/check-advisory-expiry.sh scripts/fixtures/deny-in-date.toml
          if scripts/check-advisory-expiry.sh scripts/fixtures/deny-expired.toml; then
            echo "::error::the expiry check passed a fixture it must reject"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    # M0a gate: the workspace must compile, lint clean and pass tests on both
    # first-class targets. Linux is deliberately absent until v2 (see brief §3).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build app (release)
        run: cargo build --release -p caixonho-gui
      # A bare Mach-O is not something macOS knows how to open. A browser
      # download strips the executable bit, Finder finds a file it cannot
      # identify, and a double-click opens it in TextEdit showing the raw
      # object code — which is what the first person to try the v0.1.0-beta.1
      # asset got. `ditto` is the macOS-correct zip: it keeps the bundle
      # structure and the executable bit through the round trip, so what
      # arrives is an app you drag to Applications.
      #
      # Not signed: this runner has no Developer ID, and the local
      # self-signed identity would mean nothing to anyone else. Gatekeeper
      # still asks — but "Open Anyway" is an answer to that question, where a
      # window full of object code is not.
      # What this build states about itself, read from the one place that
      # declares it (`XONHO-0033`). `cargo pkgid` rather than `cargo metadata`
      # here: metadata is JSON and needs a parser, and which parser a runner
      # has differs by image — `pkgid` needs none. `[#@]` because cargo writes
      # `#<version>` when the directory and the package share a name and
      # `#<name>@<version>` when they do not, and this should not care which.
      #
      # `shell: bash` on both, including Windows, where the runner's default is
      # PowerShell. One shell is one thing to get right.
      - name: The version this build states
        id: version
        shell: bash
        run: echo "value=$(cargo pkgid -p caixonho-gui | sed -e 's/.*[#@]//')" >> "$GITHUB_OUTPUT"
      # A bare Mach-O is not something macOS knows how to open. A browser
      # download strips the executable bit, Finder finds a file it cannot
      # identify, and a double-click opens it in TextEdit showing the raw
      # object code — which is what the first person to try the v0.1.0-beta.1
      # asset got. `ditto` is the macOS-correct zip: it keeps the bundle
      # structure and the executable bit through the round trip, so what
      # arrives is an app you drag to Applications.
      #
      # Not signed by an identity: this runner has no Developer ID. The bundle
      # is ad-hoc signed as a bundle by `mac-app.sh`, which is what stops
      # Gatekeeper calling it damaged — see that script for what that does and
      # does not buy.
      - name: Wrap in an .app (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/mac-app.sh --no-open
          ditto -c -k --keepParent target/Caixonho.app \
            "target/caixonho-${{ steps.version.outputs.value }}-macos-arm64.zip"
      # The Windows build ships the executable itself, so the executable is
      # what has to carry the version — there is no bundle to hold it. Three
      # files called `caixonho-macos-arm64.zip`, `(1)` and `(2)` sat in the
      # owner's Downloads folder on 2026-09-05 and only a checksum said which
      # release was which; this is that, prevented, on the platform where the
      # downloaded file *is* the product.
      - name: Name the executable for what it is (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/release/caixonho-gui.exe \
            "target/caixonho-${{ steps.version.outputs.value }}-windows-x86_64.exe"
      # Globs rather than the names spelled out again: the names are made
      # above, and a second place stating them is a second place to be wrong.
      # One pattern matching nothing is normal — each runner produces one of
      # these — and `if-no-files-found` fires only when *neither* does.
      - name: Upload app (on-device checks)
        uses: actions/upload-artifact@v7
        with:
          name: caixonho-app-${{ matrix.os }}
          path: |
            target/caixonho-*-macos-arm64.zip
            target/caixonho-*-windows-x86_64.exe
          if-no-files-found: error
