name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  build:
    name: build (${{ matrix.os }})
    # M0a gate: the workspace must compile, lint clean and pass tests on both
    # first-class targets. Linux is deliberately absent until v2 (see brief §3).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build app (release)
        run: cargo build --release -p caixonho-gui
      - name: Upload app binary (on-device checks)
        uses: actions/upload-artifact@v4
        with:
          name: caixonho-app-${{ matrix.os }}
          path: |
            target/release/caixonho-gui
            target/release/caixonho-gui.exe
          if-no-files-found: error
